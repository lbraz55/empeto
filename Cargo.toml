[package]
name = "workout"
version = "0.1.0"
edition = "2021"
description = "WORKOUT — organizador pessoal de treinos, offline-first (Android)"
license = "GPL-3.0-only"
publish = false
rust-version = "1.85"

[lib]
name = "workout"
crate-type = ["lib", "cdylib"]
path = "src/lib.rs"

[[bin]]
name = "workout-desktop"
path = "src/main.rs"

[dependencies]
rusqlite = { version = "0.43", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
calamine = { version = "0.38", default-features = false }
rust_xlsxwriter = { version = "0.102", default-features = false }
zip = { version = "9", default-features = false, features = ["deflate"] }
sha2 = "0.10"
log = "0.4"
libc = "0.2"

[target.'cfg(not(target_os = "android"))'.dependencies]
slint = { version = "1.19", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-femtovg", "renderer-software", "accessibility"] }
env_logger = { version = "0.11", default-features = false }

[target.'cfg(target_os = "android")'.dependencies]
slint = { version = "1.19", default-features = false, features = ["std", "compat-1-2", "backend-android-activity-06", "renderer-femtovg"] }
jni = "0.21"
android_logger = "0.15"

[build-dependencies]
slint-build = "1.19"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 4
strip = true
panic = "unwind"
